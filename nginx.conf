
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:* http://localhost:* https://eliza-ai-voice-agent-bd.onrender.com https://elizaaivoice.vercel.app ws: wss:; img-src 'self' data:; frame-ancestors 'none';" always;

    # React/Vite client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets with hashed filenames
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Do not cache the application entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Do not expose hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
